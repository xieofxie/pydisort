name: Continuous Integration

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  BUILD_TYPE: Release

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install style checkers
        run: |
          pip install --user cpplint cppcheck pre-commit

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  build-and-test:
    needs: pre-commit
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macOS-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install numpy pytest
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          else
            pip install 'torch==2.10.0'
          fi

      - name: Configure CMake
        run: |
          cmake -B ${{ github.workspace }}/build \
                -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
                -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --parallel

      - name: Install the project
        run: |
          pip install -U setuptools wheel build cmake ninja
          pip install --no-build-isolation --no-deps .

      - name: Run C++ & Pybind tests
        run: |
          ctest --test-dir ${{ github.workspace }}/build \
                --output-on-failure
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib:${{ env.LD_LIBRARY_PATH }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/build/lib:${{ env.DYLD_LIBRARY_PATH }}

  build-and-test-windows:
    needs: pre-commit
    runs-on: windows-2022
    env:
      DISTUTILS_USE_SDK: "1"
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
          cache: pip

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build dependencies
        run: |
          python -m pip install numpy pytest "torch==2.10.0" "cmake>=3.20,<4" ninja setuptools "setuptools-scm>=8" wheel build

      - name: Build CPU library and tests
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCUDA=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --parallel 2

      - name: Build and install wheel
        run: |
          python -m build --wheel --no-isolation
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist\*.whl).FullName
          python -m pip install --no-deps $wheel
        env:
          MAX_JOBS: "2"

      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pytest "$env:GITHUB_WORKSPACE\tests" -q

      - name: Run C++ and Python tests
        run: |
          $torchLib = python -c "import pathlib, torch; print(pathlib.Path(torch.__file__).parent / 'lib')"
          $env:PATH = "$torchLib;$env:PATH"
          ctest --test-dir build -C Release --output-on-failure
